# Node.js Web App - Windows Agent
# Build, test, and publish JavaScript app on Windows

trigger:
- main

pool:
  vmImage: 'windows-latest'

variables:
  buildDir: 'build'  # change to 'dist' or 'dist/project-name' if using Angular or Vue

steps:
- task: NodeTool@0
  inputs:
    versionSpec: '18.x'  # Adjust version as needed
  displayName: 'Install Node.js'

- script: |
    npm install
  displayName: 'Install dependencies'

- script: |
    npm run build
  displayName: 'Build application'

- script: |
    npm test
  displayName: 'Run tests'

- task: PublishBuildArtifacts@1
  inputs:
    PathtoPublish: '$(Build.SourcesDirectory)\$(buildDir)'
    ArtifactName: 'webapp'
    publishLocation: 'Container'
  displayName: 'Publish build artifacts'
